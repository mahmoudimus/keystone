name: Build keystone for patching-ng

# builds the shared libraries that patching-ng (github.com/mahmoudimus/patching-ng)
# vendors, and publishes them as a release for 'patching-*' tags

on:
  push:
    branches: ['**']
    tags: ['patching-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # build inside manylinux2014 (glibc 2.17) so the library loads on old distros too. the
    # container is run by hand because actions/checkout cannot run inside a glibc 2.17 image
    - name: Build (manylinux2014 x86_64)
      run: |
        docker run --rm -v "$PWD:/src" -w /src quay.io/pypa/manylinux2014_x86_64 bash -euxc '
          /opt/python/cp312-cp312/bin/pip install --quiet cmake
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DBUILD_LIBS_ONLY=1 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
          mkdir -p out && cp -L "$(find build -name libkeystone.so | head -1)" out/libkeystone.so  # lib64/ on manylinux
          strip --strip-unneeded out/libkeystone.so
        '

    - name: Check runtime requirements
      run: |
        objdump -p out/libkeystone.so | grep NEEDED
        echo "newest symbol versions required:"
        objdump -T out/libkeystone.so | grep -oE 'GLIBC(XX)?_[0-9.]+' | sort -t_ -k2 -V -u | tail -4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Smoke test
      run: python .github/scripts/smoke_test.py out/libkeystone.so

    - uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: out/libkeystone.so

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build (universal arm64 + x86_64, macOS 11+)
      run: |
        cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DBUILD_LIBS_ONLY=1 -DCMAKE_BUILD_TYPE=Release \
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
        cmake --build build -j "$(sysctl -n hw.ncpu)"
        mkdir -p out && cp -L build/llvm/lib/libkeystone.dylib out/libkeystone.dylib
        strip -x out/libkeystone.dylib
        codesign --force --sign - out/libkeystone.dylib
        file out/libkeystone.dylib
        otool -L out/libkeystone.dylib

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Smoke test
      run: python .github/scripts/smoke_test.py out/libkeystone.dylib

    - uses: actions/upload-artifact@v4
      with:
        name: macos-universal
        path: out/libkeystone.dylib

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: ilammy/msvc-dev-cmd@v1

    # KEYSTONE_BUILD_STATIC_RUNTIME (default ON) links the C runtime statically (/MT), so the
    # dll only depends on KERNEL32 and needs no Visual C++ redistributable
    - name: Build (x64)
      shell: bash
      run: |
        cmake -S . -B build -G "NMake Makefiles" -DBUILD_SHARED_LIBS=ON -DBUILD_LIBS_ONLY=1 \
          -DCMAKE_BUILD_TYPE=Release -DKEYSTONE_BUILD_STATIC_RUNTIME=ON
        cmake --build build
        mkdir -p out && cp "$(find build -name keystone.dll | head -1)" out/keystone.dll
        dumpbin //dependents out/keystone.dll

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Smoke test
      run: python .github/scripts/smoke_test.py out/keystone.dll

    - uses: actions/upload-artifact@v4
      with:
        name: windows-x64
        path: out/keystone.dll

  release:
    if: startsWith(github.ref, 'refs/tags/patching-')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd dist
        sha256sum libkeystone.dylib libkeystone.so keystone.dll > SHA256SUMS
        cat SHA256SUMS
        gh release create "${{ github.ref_name }}" libkeystone.dylib libkeystone.so keystone.dll SHA256SUMS \
          --repo "${{ github.repository }}" --title "${{ github.ref_name }}" \
          --notes "Keystone shared libraries for patching-ng, built from ${{ github.sha }} by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
